name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    name: Build, Release & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build & Release Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Generate Changelog Automatically
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "## What's Changed in ${{ github.ref_name }}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h by @%an)" --no-merges >> CHANGELOG.md
          else
            git log --pretty=format:"* %s (%h by @%an)" --no-merges >> CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md
          echo "Full Changelog: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}" >> CHANGELOG.md

      - name: Build Distribution Packages
        run: python -m build

      - name: Verify Distribution Packages
        run: twine check dist/*

      - name: Create GitHub Release with Automatic Changelog
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
